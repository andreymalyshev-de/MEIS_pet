services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: metrics_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrics_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10


  meis:
    build: .
    ports:
      - "8080:8080"

    environment:
      DB_PASSWORD: ${DB_PASSWORD}

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/metrics_analytics
      SPRING_DATASOURCE_USERNAME: postgres

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: